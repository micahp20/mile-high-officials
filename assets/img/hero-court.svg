<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <title>Basketball court</title>
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a6328"/>
      <stop offset="50%" stop-color="#b57936"/>
      <stop offset="100%" stop-color="#8f5a24"/>
    </linearGradient>
    <pattern id="planks" width="28" height="520" patternUnits="userSpaceOnUse">
      <rect width="28" height="520" fill="#b57936"/>
      <rect x="0" width="14" height="520" fill="#c58942"/>
      <rect x="14" width="14" height="520" fill="#a86d2f"/>
      <rect x="27" width="1" height="520" fill="rgba(70,35,10,0.28)"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
    <clipPath id="court">
      <rect x="0" y="0" width="400" height="520"/>
    </clipPath>
  </defs>
  <g clip-path="url(#court)">
    <rect width="400" height="520" fill="url(#planks)"/>
    <rect width="400" height="520" fill="#b57936" opacity="0.18" filter="url(#grain)"/>
    <!-- sidelines and baseline -->
    <rect x="28" y="24" width="344" height="472" fill="none" stroke="#f4ead6" stroke-width="4"/>
    <line x1="28" y1="472" x2="372" y2="472" stroke="#f4ead6" stroke-width="5"/>
    <!-- paint / key -->
    <rect x="130" y="268" width="140" height="204" fill="rgba(140,70,20,0.18)" stroke="#f4ead6" stroke-width="3.5"/>
    <!-- lane hash marks -->
    <g stroke="#f4ead6" stroke-width="3" stroke-linecap="square">
      <line x1="118" y1="316" x2="130" y2="316"/>
      <line x1="270" y1="316" x2="282" y2="316"/>
      <line x1="118" y1="348" x2="130" y2="348"/>
      <line x1="270" y1="348" x2="282" y2="348"/>
      <line x1="118" y1="380" x2="130" y2="380"/>
      <line x1="270" y1="380" x2="282" y2="380"/>
      <line x1="118" y1="412" x2="130" y2="412"/>
      <line x1="270" y1="412" x2="282" y2="412"/>
    </g>
    <!-- free throw line and circle — centered for the logo -->
    <line x1="130" y1="268" x2="270" y2="268" stroke="#f4ead6" stroke-width="3.5"/>
    <circle cx="200" cy="200" r="68" fill="none" stroke="#f4ead6" stroke-width="3.5"/>
    <!-- lower half of the FT circle inside the lane, dashed (NBA style) -->
    <path d="M132 268 A68 68 0 0 0 268 268" fill="none" stroke="#f4ead6" stroke-width="3" stroke-dasharray="8 7"/>
    <!-- restricted area arc near the hoop -->
    <path d="M160 444 A40 40 0 0 1 240 444" fill="none" stroke="#f4ead6" stroke-width="3"/>
    <!-- backboard and hoop at baseline -->
    <line x1="166" y1="476" x2="234" y2="476" stroke="#f4ead6" stroke-width="5" stroke-linecap="square"/>
    <circle cx="200" cy="456" r="11" fill="none" stroke="#f4ead6" stroke-width="3.5"/>
    <line x1="200" y1="444" x2="200" y2="476" stroke="#f4ead6" stroke-width="2.5"/>
    <!-- three-point arc -->
    <path d="M56 472 L56 360 A144 144 0 0 0 344 360 L344 472" fill="none" stroke="#f4ead6" stroke-width="3.5"/>
    <!-- mid-court hint at the top -->
    <line x1="28" y1="24" x2="372" y2="24" stroke="#f4ead6" stroke-width="4"/>
    <circle cx="200" cy="24" r="42" fill="none" stroke="#f4ead6" stroke-width="3.5"/>
  </g>
</svg>
